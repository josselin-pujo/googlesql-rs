[package]
edition = "2024"
rust-version = "1.94"
name = "googlesql"
version = "0.4.0"
build = "build.rs"
links = "guest_ffi"
exclude = [
    ".github/",
    ".workspace_cache/",
    "codecov.yml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for GoogleSQL (ZetaSQL) via a prebuilt WebAssembly module"
readme = "README.md"
keywords = [
    "googlesql",
    "zetasql",
    "sql",
    "parser",
    "wasm",
]
categories = [
    "database",
    "parser-implementations",
    "api-bindings",
]
license = "Apache-2.0"
repository = "https://github.com/hirosassa/googlesql-rs"

[package.metadata.docs.rs]
no-default-features = true
features = [
    "wasmtime",
    "native-ffi",
]

[features]
default = ["native-ffi"]
native = []
native-ffi = []
# `dep:tzdb` rides with the engine: every windows wasmtime build needs the
# bundled database, while a unix one compiles it unreferenced (host database
# stays the source of truth) unless the hermetic arm below opts in.
wasmtime = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:zstd",
    "dep:tzdb",
    "dep:libc",
]
# Hermetic analysis: bundle the IANA tz database into the wasmtime backend
# instead of reading the host's /usr/share/zoneinfo, so every host resolves
# zones against the same tz data regardless of local zoneinfo modifications.
# On unix this is the opt-in and pulls `libc` for the per-user cache root;
# the `tzdb` crate itself is already activated by `wasmtime`, so this only
# marks the hermetic arm.
bundled-tzdb = ["dep:tzdb", "dep:libc"]

