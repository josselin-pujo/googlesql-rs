# zstd decoder for the embedded, compressed googlesql.wasm (copied-executable
# installs; see wasmtime_backend's load_module). Decoder only — the compressed
# artifact itself is produced by build.rs.
[dependencies.zstd]
version = "0.13"
optional = true
default-features = false

# Optional IANA tz database for the wasmtime backend's analyzer: the materialized
# zones are preopened at the guest path /usr/share/zoneinfo so cctz resolves
# named zones without a host database. Activated by the `wasmtime` feature:
# every windows wasmtime build needs it (the host has no /usr/share/zoneinfo,
# and its absence made every analyze call trap), while the default `native-ffi`
# build never compiles or links tz data it cannot use. Platform-scoping the
# activation tighter than that is not expressible — a `dep:` reference in a
# feature is not target-filtered, and declaring the crate under per-platform
# names makes cargo reject any build activating both ("multiple times with
# different names") — so a unix plain-wasmtime build compiles this crate
# without referencing it: its analyzer keeps using the host database unless
# `bundled-tzdb` opts into the hermetic one, only that arm reads `tzdb::`.
# `default-features = false`: tzdb's defaults pull `local` (-> `iana-time-zone`
# -> `windows-core`, `js-sys`, ...), and none of the APIs used here (VERSION,
# TZ_NAMES, raw_tz_by_name) is feature-gated.
[dependencies.tzdb]
version = "0.7"
optional = true
default-features = false

# `getuid` for the per-user temp cache roots and their ownership checks (see
# `tzdb_cache_root` / `cwasm_cache_dir` / `dir_is_private` in
# src/wasmtime_backend.rs): unix `/tmp` is shared and world-writable, so any
# cache there must be verifiably ours — the tzdb cache under `bundled-tzdb`,
# and the cwasm cache every wasmtime build may deserialize. `dep:libc` is
# target-gated to unix, so the feature reference is a no-op elsewhere; on
# unix wasmtime builds libc is linked transitively (rustix) anyway, and the
# direct activation only adds the declaration.
[target.'cfg(unix)'.dependencies.libc]
version = "0.2"
optional = true
default-features = false

[dev-dependencies.criterion]
version = "0.8"

[build-dependencies.sha2]
version = "0.11"

[build-dependencies.wasmtime]
version = "47"
optional = true

[build-dependencies.zstd]
version = "0.13"

